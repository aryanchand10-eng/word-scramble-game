<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Scramble</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sun"></div>
    <div class="stars" id="stars"></div>
    <div class="clouds" id="clouds"></div>
  </div>

  <div class="game-container" id="card">
    <h1>🔤 Word Scramble</h1>

    <div class="controls">
      <label for="length-select">Letters:</label>
      <select id="length-select">
        <option value="4">4</option>
        <option value="5" selected>5</option>
        <option value="6">6</option>
        <option value="7">7</option>
      </select>
    </div>

    <div class="scrambled" id="scrambled"></div>

    <input type="text" id="guess" placeholder="Type your guess" autocomplete="off">

    <div class="button-row">
      <button id="submit-btn">Submit</button>
      <button id="skip-btn">Skip</button>
    </div>

    <p id="message"></p>
    <div class="stats">
      <p class="score">Score: <span id="score">0</span></p>
      <p class="streak">🔥 Streak: <span id="streak">0</span></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
